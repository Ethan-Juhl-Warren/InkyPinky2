<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inky Editor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="menubar">
      <span class="brand">Inky</span>
      <span>File</span><span>Edit</span><span>Entity</span><span>Component</span><span>Window</span>
    </div>

    <div class="workspace">
      <aside class="panel">
        <header>Hierarchy</header>
        <!-- filled in by hierarchy.ts -->
        <div id="hierarchy-body"></div>
      </aside>

      <!--
        The engine renders offscreen and the main process sends finished frames
        here to be painted. It is an ordinary canvas, which is the whole point:
        it sits in the layout like any other element, the rest of the interface
        can draw over it, and it receives mouse events normally.
      -->
      <section class="panel">
        <header>Scene</header>
        <canvas id="viewport"></canvas>
      </section>

      <aside class="panel">
        <header>Inspector</header>
        <!-- filled in by inspector.ts -->
        <div id="inspector-body"></div>
      </aside>
    </div>

    <footer class="statusbar">
      <span id="status">starting</span>
      <span>click the viewport to look &middot; W A S D move &middot; Space up &middot; Shift down</span>
    </footer>

    <script>require('./dist/renderer.js');</script>
  </body>
</html>
